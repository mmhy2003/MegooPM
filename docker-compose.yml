# MegooPM — PRODUCTION, single node.
#
#   cp .env.example .env     # fill in the "required" section
#   docker compose up -d --build         # or: make prod-up
#
# Everything runs on this host: Postgres, Redis, CrowdSec, the API, the Celery
# worker + beat, the web UI (Next.js standalone build) and the managed nginx.
# No Docker socket is mounted anywhere: the worker validates/reloads nginx via
# the token-gated agent inside the nginx container (docs/nginx-engine.md).
#
# Development with hot reload: docker-compose.dev.yml. Multi-node: docker-compose.ha.yml.

name: megoopm-prod

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-megoopm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-megoopm}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Must be the origin the browser loads the UI from.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  SHARED_DATA_DIR: /data
  HA_ENABLED: "false"
  HA_LOCK_DIR: /var/run/megoopm
  NGINX_TEST_COMMAND: "python -m scripts.nginx_remote test"
  NGINX_RELOAD_COMMAND: "python -m scripts.nginx_remote reload"
  NGINX_AGENT_ADDR: nginx:9099
  NGINX_RELOAD_TOKEN: ${NGINX_RELOAD_TOKEN:?NGINX_RELOAD_TOKEN is required (openssl rand -hex 32)}
  # Real certificates by default; point at the staging directory to test.
  ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
  ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-}
  ACME_DNS_PROPAGATION_TIMEOUT_SECONDS: ${ACME_DNS_PROPAGATION_TIMEOUT_SECONDS:-120}
  ACME_DNS_PROPAGATION_INTERVAL_SECONDS: ${ACME_DNS_PROPAGATION_INTERVAL_SECONDS:-5}
  ACME_DNS_PROPAGATION_SETTLE_SECONDS: ${ACME_DNS_PROPAGATION_SETTLE_SECONDS:-10}
  # Defaults to the bundled agent. Point at an external/shared LAPI by setting
  # these in .env — they must be reachable from inside the containers.
  CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL:-http://crowdsec:8080}
  CROWDSEC_LAPI_KEY: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is required (openssl rand -hex 32)}
  # Matches LAPI's auto_registration token (infra/crowdsec/config.yaml.local) so
  # the backend's self-registered machine is validated without any cscli step.
  CROWDSEC_REGISTRATION_TOKEN: ${CROWDSEC_REGISTRATION_TOKEN:?CROWDSEC_REGISTRATION_TOKEN is required (openssl rand -hex 32)}
  CROWDSEC_MACHINE_ID: ${CROWDSEC_MACHINE_ID:-}
  CROWDSEC_MACHINE_PASSWORD: ${CROWDSEC_MACHINE_PASSWORD:-}
  # No default admin in production. Either set both here before the first
  # start, or seed later with: docker compose exec backend python -m scripts.create_user …
  # Whitelist reloads: names the node whose worker holds the docker socket
  # and runs the CrowdSec container. Blank disables reloads — whitelists
  # then save but are reported as not applied. See docs/crowdsec.md.
  CROWDSEC_CONTROL_NODE_ID: ${CROWDSEC_CONTROL_NODE_ID:-}
  CROWDSEC_CONTAINER_NAME: ${CROWDSEC_CONTAINER_NAME:-megoopm-crowdsec-1}
  CROWDSEC_RELOAD_HEALTH_TIMEOUT_SECONDS: ${CROWDSEC_RELOAD_HEALTH_TIMEOUT_SECONDS:-60}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megoopm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-megoopm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megoopm} -d ${POSTGRES_DB:-megoopm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: lay out /data and hand it to the backend user (uid 1000) so the
  # backend/worker can write renders and certs while nginx (root) reads them.
  data-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - "mkdir -p /data/nginx/conf.d/stream /data/nginx/default /data/certs/_acme-challenge /data/crowdsec/whitelists && { [ -f /data/crowdsec/whitelists/megoopm.yaml ] || echo '# Managed by MegooPM - no whitelists defined.' > /data/crowdsec/whitelists/megoopm.yaml; } && { [ -f /data/crowdsec/config.yaml.local ] || cp /seed/config.yaml.local /data/crowdsec/config.yaml.local; } && chown -R 1000:1000 /data || { echo 'data-init: cannot prepare /data for uid 1000' >&2; exit 1; }"
    volumes:
      - app_data:/data
      - ./infra/crowdsec/config.yaml.local:/seed/config.yaml.local:ro

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - app_data:/data
      # Reload path: the worker restarts the CrowdSec container so it
      # re-reads the whitelist parser file. Mounted here and deliberately NOT
      # on `backend` — the socket is root-equivalent on the host and backend is
      # the process taking internet traffic.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app.celery_app", "inspect", "ping"]
      interval: 20s
      timeout: 10s
      start_period: 25s
      retries: 5

  beat:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Inlined at build time by Next: rebuild the image after changing them.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required (the public URL of the API, e.g. https://megoopm-api.example.com)}
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-true}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    environment:
      CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL:-http://crowdsec:8080}
      CROWDSEC_APPSEC_URL: ${CROWDSEC_APPSEC_URL:-http://crowdsec:7422}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is required}
      NGINX_RELOAD_TOKEN: ${NGINX_RELOAD_TOKEN:?NGINX_RELOAD_TOKEN is required}
      # Visitor analytics: the log-phase handler counts into Redis.
      # Set ANALYTICS_ENABLED=false to turn counting off entirely.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      # Ship access/error logs to the CrowdSec agent (syslog/UDP) so its nginx
      # scenarios detect attackers. Behind a CDN/tunnel/LB set the real-IP pair
      # (e.g. Cloudflare: NGINX_REAL_IP_HEADER=CF-Connecting-IP) or detections
      # would ban the proxy's own address.
      CROWDSEC_SYSLOG_ADDR: ${CROWDSEC_SYSLOG_ADDR:-crowdsec:514}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-}
      NGINX_REAL_IP_FROM: ${NGINX_REAL_IP_FROM:-}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - app_data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      crowdsec:
        condition: service_started

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.4
    depends_on:
      # The whitelist mount below is a bind mount of a FILE. Docker creates a
      # DIRECTORY at the source when it does not exist, and CrowdSec then
      # refuses to start — so this must not come up before data-init has
      # seeded the file.
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DISABLE_ONLINE_API: "true"
      # The community blocklist inserts ~15k rows; CrowdSec warns LAPI may stall
      # without WAL.
      USE_WAL: "true"
      BOUNCER_KEY_megoopm: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is required}
      CROWDSEC_REGISTRATION_TOKEN: ${CROWDSEC_REGISTRATION_TOKEN:?CROWDSEC_REGISTRATION_TOKEN is required}
      COLLECTIONS: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/nginx"
    expose:
      - "8080"
      - "7422"
      - "514/udp"
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./infra/crowdsec/acquis/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - ./infra/crowdsec/acquis/nginx-syslog.yaml:/etc/crowdsec/acquis.d/nginx-syslog.yaml:ro
      # The app-owned config override: LAPI machine auto-registration, plus the
      # community-blocklist block when Security → Updates switches it on. A
      # single FILE out of the shared volume, seeded by data-init.
      - type: volume
        source: app_data
        target: /etc/crowdsec/config.yaml.local
        read_only: true
        volume:
          subpath: crowdsec/config.yaml.local
      # Whitelists authored in the UI. A single FILE out of the shared
      # volume: s02-enrich also holds hub-installed parsers and mounting a
      # directory over it would mask them. `subpath` needs Docker Engine 26+
      # / Compose 2.26+; the HA file uses a plain host-path bind instead.
      - type: volume
        source: app_data
        target: /etc/crowdsec/parsers/s02-enrich/99-megoopm-whitelist.yaml
        read_only: true
        volume:
          subpath: crowdsec/whitelists/megoopm.yaml

volumes:
  pgdata:
  app_data:
  crowdsec_config:
  crowdsec_data:
