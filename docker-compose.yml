# MegooPM — full-stack local development orchestration.
#
# Brings the entire system up with one command:
#
#   cp .env.example .env        # optional — sane defaults are baked in below
#   docker compose up --build
#
# Services: postgres, redis, backend (uvicorn), celery worker + beat,
# frontend (next dev), the managed nginx proxy MegooPM controls, and a
# crowdsec placeholder. See README.md / `make help` for the dev workflow.
#
# Only need the API + DB? backend/docker-compose.yml is a lighter db+api stack.

name: megoopm

# Shared backend/worker/beat environment. All three run the same image and
# must agree on the database, broker, and proxy paths.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-megoopm}:${POSTGRES_PASSWORD:-megoopm}@db:5432/${POSTGRES_DB:-megoopm}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  NGINX_CONFD_DIR: /etc/nginx/conf.d
  NGINX_CERTS_DIR: /etc/nginx/certs
  # CrowdSec LAPI (MEG-22). The bouncer key drives the *read* path (decisions);
  # machine creds (optional; register with `cscli machines add`) enable the
  # alert read + manual-decision write paths. Left blank they simply disable
  # those endpoints (503) rather than erroring.
  CROWDSEC_LAPI_URL: http://crowdsec:8080
  CROWDSEC_LAPI_KEY: ${CROWDSEC_BOUNCER_KEY:-megoopm-dev-bouncer-key}
  CROWDSEC_MACHINE_ID: ${CROWDSEC_MACHINE_ID:-}
  CROWDSEC_MACHINE_PASSWORD: ${CROWDSEC_MACHINE_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megoopm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-megoopm}
      POSTGRES_DB: ${POSTGRES_DB:-megoopm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megoopm} -d ${POSTGRES_DB:-megoopm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create and hand the shared proxy volumes to the backend user
  # (uid 1000) so the backend can write vhosts/certs while nginx (root) reads.
  proxy-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /shared/conf.d /shared/certs && chown -R 1000:1000 /shared/conf.d /shared/certs"
    volumes:
      - nginx_confd:/shared/conf.d
      - nginx_certs:/shared/certs

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Backend owns the managed proxy config: it writes vhosts and TLS certs
      # onto shared named volumes that the nginx container reads.
      - nginx_confd:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    build: ./backend
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    # The worker executes reload_nginx_config: it writes managed vhosts onto the
    # shared conf.d volume and then validates+reloads nginx. Without the volumes
    # it hit PermissionError/FileNotFoundError on /etc/nginx and never applied
    # config (defect 5c770e72 D4). It reaches the separate nginx container's
    # binary via `docker exec` over the mounted socket; run as root in dev so it
    # can access that socket (C_FORCE_ROOT lets Celery run as root). This is a
    # dev-compose channel — production uses the MEG-28 worker↔nginx transport.
    user: root
    environment:
      <<: *backend-env
      # The backend service owns migrations; the worker must not race it.
      RUN_MIGRATIONS: "0"
      C_FORCE_ROOT: "true"
      # Cross-container validate+reload of the managed proxy. Matches the nginx
      # container's own CMD (openresty prefix + config) so `-t` checks exactly
      # the config that is running before a reload is signalled.
      NGINX_TEST_COMMAND: "docker exec megoopm-nginx openresty -p /usr/local/openresty/nginx -c /etc/nginx/nginx.conf -t"
      NGINX_RELOAD_COMMAND: "docker exec megoopm-nginx openresty -p /usr/local/openresty/nginx -c /etc/nginx/nginx.conf -s reload"
    volumes:
      # Same shared proxy volumes the backend mounts: the worker writes vhosts
      # and TLS material the nginx container reads. Certs are rw here because
      # ACME issuance/renewal tasks run on the worker.
      - nginx_confd:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs
      # Lets the worker run `docker exec` against the nginx container to
      # validate+reload. The Docker API is a read/write socket even for exec,
      # so it is mounted rw (dev-only; scoped away in the MEG-28 transport).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      # nginx must exist for `docker exec` to reach it on reload.
      nginx:
        condition: service_started
      proxy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app.celery_app", "inspect", "ping"]
      interval: 20s
      timeout: 10s
      start_period: 25s
      retries: 5

  beat:
    build: ./backend
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    # Disable the healthcheck inherited from the shared backend image
    # (curl :8000/health). This container runs only the Celery *scheduler* — it
    # has no HTTP server on :8000, so the inherited probe is permanently
    # unhealthy (MEG-41). There is no honest lightweight beat liveness probe
    # here: `celery inspect ping` broadcasts over the broker and is answered by
    # *workers*, not the scheduler, so it would report the worker's health and
    # mask a real beat outage — worse than no check. Liveness is observed via
    # beat's own scheduler logs ("Sending due task heartbeat-every-5-minutes").
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Browser-facing: the SPA calls the backend on its published host port.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    # Next dev compiles routes on first request; `GET /` takes ~7s the first time
    # (MEG-41). The old 5s timeout expired mid-compile and flapped the container
    # to unhealthy even though it serves 200 fine. timeout > worst-case compile,
    # plus a wider start_period, absorbs the cold-start compile without flapping.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 15s
      start_period: 60s
      retries: 10

  # The managed nginx reverse proxy MegooPM controls. Its base config includes
  # /etc/nginx/conf.d/*.conf, which the backend writes onto a shared volume.
  # Built from infra/nginx/Dockerfile: OpenResty + the CrowdSec bouncer, so
  # per-host bouncer/AppSec directives the backend renders actually enforce
  # (MEG-22). Still a drop-in for the plain nginx image otherwise.
  nginx:
    build: ./infra/nginx
    # Pinned name so the Celery worker can target it deterministically with
    # `docker exec` for the cross-container config validate+reload (defect
    # 5c770e72 D4); without a fixed name the container is megoopm-nginx-1.
    container_name: megoopm-nginx
    environment:
      # Consumed by the container entrypoint to render the bouncer config; the
      # key must match the one CrowdSec registered for this bouncer below.
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_APPSEC_URL: http://crowdsec:7422
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-megoopm-dev-bouncer-key}
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_confd:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      proxy-init:
        condition: service_completed_successfully
      crowdsec:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # CrowdSec security engine (MEG-22): Local API (LAPI, :8080) + inline AppSec
  # WAF (:7422). Auto-registers the nginx bouncer with a known dev key and
  # installs the AppSec rule collections so the WAF has rules to match. The
  # AppSec datasource is declared in infra/crowdsec/acquis/appsec.yaml.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.4
    environment:
      DISABLE_ONLINE_API: "true"
      # Register the nginx bouncer at startup with a fixed key (dev only —
      # override CROWDSEC_BOUNCER_KEY with a real secret in deployed stacks).
      BOUNCER_KEY_megoopm: ${CROWDSEC_BOUNCER_KEY:-megoopm-dev-bouncer-key}
      # Rules the inline AppSec/WAF enforces.
      COLLECTIONS: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/nginx"
    expose:
      - "8080"  # LAPI
      - "7422"  # AppSec
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      # Bind the acquis *file*, not the directory (MEG-36 Defect A). On a fresh
      # crowdsec_config volume the v1.6.4 image's startup rsync chowns
      # /etc/crowdsec/acquis.d; a read-only bind of the directory makes that
      # chown fail ("Read-only file system"), rsync exits 23, and the crowdsec
      # container dies before the bouncer/AppSec engine ever comes up. Mounting
      # the single file leaves the parent dir writable for that chown.
      - ./infra/crowdsec/acquis/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro

volumes:
  pgdata:
  nginx_confd:
  nginx_certs:
  crowdsec_config:
  crowdsec_data:
