name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: megoopm
          POSTGRES_PASSWORD: megoopm
          POSTGRES_DB: megoopm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U megoopm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://megoopm:megoopm@localhost:5432/megoopm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (migrations match models)
        # Fails if ORM models have changes not captured in a migration.
        run: alembic check

      - name: Pytest
        # Includes the OpenAPI contract test, which fails if backend/openapi.json
        # has drifted from the app's live schema (regenerate via
        # `python -m scripts.export_openapi`).
        run: pytest
