name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are in sync
        # `src/lib/api/generated/schema.ts` is generated from the backend's
        # published contract. Regenerate and fail if it drifts (fix locally with
        # `npm run gen:api`).
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/generated/schema.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
