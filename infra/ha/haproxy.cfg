# Reference HAProxy config for the MegooPM HA stack (MEG-35).
#
# Fronts three things:
#   :80  / :443  → the managed nginx data plane (proxy1/proxy2). TCP passthrough
#                  so each nginx node terminates TLS itself with the shared
#                  certs — the LB stays cert-agnostic.
#   :8000        → the stateless FastAPI API nodes (the `backend` service, which
#                  Docker DNS round-robins across all --scale replicas).
#
# `resolvers docker` lets HAProxy follow the backend service's replica IPs so
# `--scale backend=N` is picked up without editing this file.

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    timeout connect 5s
    timeout client  60s
    timeout server  60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# --- Real traffic: L4 passthrough to the nginx data plane ---
frontend http_in
    mode tcp
    bind *:80
    default_backend nginx_nodes_http

backend nginx_nodes_http
    mode tcp
    balance roundrobin
    server proxy1 proxy1:80 check
    server proxy2 proxy2:80 check

frontend https_in
    mode tcp
    bind *:443
    default_backend nginx_nodes_https

backend nginx_nodes_https
    mode tcp
    balance roundrobin
    server proxy1 proxy1:443 check
    server proxy2 proxy2:443 check

# --- Control-plane API: L7 across the stateless backend replicas ---
frontend api_in
    mode http
    bind *:8000
    default_backend api_nodes

backend api_nodes
    mode http
    balance roundrobin
    option httpchk GET /health
    # server-template spins up N slots resolved from Docker DNS as replicas
    # scale up/down.
    server-template api 4 backend:8000 check resolvers docker init-addr none
