# CrowdSec OpenResty bouncer configuration (MEG-22).
#
# Read once at nginx startup by lua/megoopm_crowdsec_init.lua. Values are
# substituted from the environment by the container entrypoint so no secret is
# baked into the image (see docker-compose.yml `nginx` service + .env.example).
#
# The bouncer runs in `stream` mode: it pulls the full decision set from LAPI on
# an interval and caches it, so per-request checks are a local lookup (fast) and
# a brief LAPI outage does not fail requests open/closed unexpectedly.

ENABLED=true
API_URL=${CROWDSEC_LAPI_URL}
API_KEY=${CROWDSEC_BOUNCER_KEY}

# Enforce every remediation kind CrowdSec emits (ban, captcha, throttle).
BOUNCING_ON_TYPE=all
# Stream mode + refresh cadence (seconds).
MODE=stream
UPDATE_FREQUENCY=10

# What to return to a bounced client, and the fail-open/closed posture when LAPI
# itself is unreachable (bypass = fail open; the request is allowed).
FALLBACK_REMEDIATION=ban
REQUEST_TIMEOUT=1000
CACHE_EXPIRATION=1

# --- AppSec / inline WAF ---
# The AppSec component listens here. Setting APPSEC_URL turns AppSec on GLOBALLY:
# lua-cs-bouncer v1.0.8 runs AppSec inside `Allow()` for every request whenever
# this is set, with no per-call switch (MEG-32 / defect 5c770e72 D3). So AppSec
# is currently a global on/off shared by all `crowdsec_enabled` hosts; the
# per-host `crowdsec_appsec_enabled` flag is not yet honoured. Leave this blank
# to disable AppSec entirely. See docs/crowdsec.md.
APPSEC_URL=${CROWDSEC_APPSEC_URL}
# On an AppSec backend error, deny (fail closed) rather than silently allow.
APPSEC_FAILURE_ACTION=deny
