# Base config for the managed nginx proxy MegooPM controls.
#
# This file is the stable entrypoint mounted read-only. The MegooPM backend
# generates one *.conf per managed host into /data/nginx/conf.d (the shared
# data root, mounted into this container at the same path), and this config
# `include`s them. TLS certs land under /data/certs. Reload managed vhosts with
# `nginx -s reload` (in the compose stacks: via the reload agent, see
# docker-entrypoint.sh).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # nginx defaults proxy_read_timeout to 60s, which is the gap between two
    # reads from the upstream -- not the total request. That is far too short
    # for anything that thinks before answering: MegooPM's own AI page
    # generation was being cut off mid-flight and surfacing in the browser as
    # an opaque "Failed to fetch", because a 504 from here carries none of the
    # proxied app's CORS headers.
    #
    # These are deliberately LONGER than any timeout the backend applies to
    # itself, so the innermost one always fires first and the operator gets a
    # real message instead of a severed connection. A host that wants something
    # tighter can override both in its own advanced config.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # proxy_connect_timeout is deliberately left at its default: a connection
    # that takes a minute to establish is a dead upstream, and waiting longer
    # only delays finding out.

    # No cap on request bodies. nginx defaults to 1m, which rejects ordinary
    # uploads through a managed host with a 413 that the proxied app never sees
    # and cannot explain.
    #
    # The trade is real: nginx buffers a request body to disk before forwarding
    # it, so one client can fill the data volume with a single upload and
    # nothing here will stop them. A host that wants a bound sets its own
    # client_max_body_size in its advanced config, which overrides this.
    client_max_body_size 0;

    # Access/error log targets and trusted-proxy real-IP settings, rendered by
    # docker-entrypoint.sh from CROWDSEC_SYSLOG_ADDR / NGINX_REAL_IP_*.
    include /etc/nginx/logging.conf;

    # DNS resolver for runtime name lookups (MEG-22 / defect 5c770e72 D1).
    # The CrowdSec bouncer reaches LAPI (crowdsec:8080) and AppSec
    # (crowdsec:7422) by *hostname* at request time, so nginx needs a resolver
    # or OpenResty logs `no resolver defined to resolve "crowdsec"` and never
    # talks to CrowdSec. 127.0.0.11 is Docker's embedded DNS; ipv6=off avoids a
    # spurious AAAA lookup for the compose-network A-only names.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # --- CrowdSec bouncer (MEG-22) ---
    # The bouncer + inline AppSec run as Lua in nginx's access phase (OpenResty;
    # see infra/nginx/Dockerfile). Enforcement is attached PER HOST by the
    # backend-generated vhosts (access_by_lua_file), not globally — a host with
    # the CrowdSec toggle off is never bounced. These directives only load and
    # initialise the module once so the per-host handler is cheap.
    #
    # `lua_shared_dict crowdsec_cache` is the decision cache the stock bouncer
    # module expects by name. If the module is absent (e.g. running the plain
    # nginx image without the bouncer) these are the only CrowdSec lines and the
    # managed vhosts simply won't reference the handler.
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict crowdsec_cache 50m;
    init_by_lua_file /etc/nginx/lua/megoopm_crowdsec_init.lua;

    # Start the bouncer's stream-pull timer (MEG-22 / defect 5c770e72 D2).
    # crowdsec-bouncer.conf runs MODE=stream: decisions are pulled from LAPI on
    # an interval by a per-worker timer that `SetupStream()` arms. That timer
    # can only be created in the init_worker phase — init_by_lua alone leaves
    # the decision cache empty, so banned IPs are never blocked (`cscli bouncers
    # list` shows an empty "Last API pull"). _G.megoopm_crowdsec is set by
    # init_by_lua_file above and inherited by each forked worker.
    init_worker_by_lua_block {
        if _G.megoopm_crowdsec and _G.megoopm_crowdsec.SetupStream then
            _G.megoopm_crowdsec.SetupStream()
        end
    }

    # Websocket upgrade helper. Managed proxy-host blocks reference
    # $connection_upgrade when "allow_websocket_upgrade" is enabled; the map
    # must be defined exactly once in the http{} context, so it lives here in
    # the base config rather than in the per-host files the backend generates.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default server: answers the container healthcheck and swallows requests
    # for hosts MegooPM has not (yet) configured a vhost for.
    server {
        listen      80 default_server;
        server_name _;

        # Without this, a request matching no location falls through to
        # OpenResty's compiled-in root and is served its welcome page -- a
        # regression on the `return 404` this block used to hardcode, and a
        # needless disclosure of what is running. Pointing root at a path that
        # does not exist makes the fall-through a plain 404. The managed
        # location below sets its own root when it serves a document.
        root /var/empty/megoopm;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The default site, chosen under Settings in the app and written here by
        # the backend. There is deliberately no `location /` fallback: nginx
        # answers 404 when no location matches, which is exactly what this block
        # used to hardcode -- so an absent file degrades to the old behaviour
        # rather than to something unintended. A second `location /` alongside
        # this include would be a duplicate-location error.
        include /data/nginx/default/*.conf;
    }

    # Managed virtual hosts written by the backend onto the shared volume.
    # Empty until the backend creates its first proxy host. The glob is
    # non-recursive, so the stream/ subdirectory (TCP/UDP forwards, below) is
    # never pulled into the http{} context.
    include /data/nginx/conf.d/*.conf;
}

# --- Raw TCP/UDP forwarding (MEG-24) ---
# Streams are a top-level context, a sibling of http{}. The backend writes one
# managed *.conf per stream into conf.d/stream/ on the same shared volume; this
# block includes them. Empty (and inert) until the first stream is created.
stream {
    include /data/nginx/conf.d/stream/*.conf;
}
