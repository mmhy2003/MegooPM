# Base config for the managed nginx proxy MegooPM controls.
#
# This file is the stable entrypoint mounted read-only. The MegooPM backend
# generates one *.conf per managed host into /data/nginx/conf.d (the shared
# data root, mounted into this container at the same path), and this config
# `include`s them. TLS certs land under /data/certs. Reload managed vhosts with
# `nginx -s reload` (in the compose stacks: via the reload agent, see
# docker-entrypoint.sh).

worker_processes auto;

# Every syslog target a server block names (its live and CrowdSec error logs)
# is a socket in each worker, opened on first use and not counted in
# worker_connections. Hundreds of hosts mean hundreds of them, on top of the
# client and upstream connections: the default soft limit of 1024 is too close.
worker_rlimit_nofile 65535;

# The main error log: nginx's own messages, outside any request -- the master
# and workers starting, reloading, exiting or crashing, and config errors.
#
# The first target restates the compiled-in default exactly (logs/error.log
# under the -p prefix, a symlink to stderr in the image, at `error`): declaring
# any main error_log replaces that default, and the container log must not
# change. The second sends the same messages, down to `notice` (what process
# messages are logged at), to the Live logs relay as "nginx itself" (host key
# n, docs/live-logs.md). http{} declares its own error logs and does not
# inherit these; the relay's own server logs to stderr only, so it never feeds
# itself.
#
# A few messages the relay causes are still written to this cycle log, not
# the relay server's: `lua_max_running_timers are not enough`, and stream
# resolver errors (Redis is reached by name). They come back as n lines. The
# relay drops the timer one (relaying it would want another timer); the rest
# are bounded by the relay's caps, and by the NUMSUB cache dropping everything
# while nobody watches n or All logs.
#
# stream{} declares no error_log of its own, so it inherits both of these,
# mgm_n included. Every stream server must keep declaring its own error_log
# (the relay's: stderr; a stream host's: its own targets), or its lines would
# be relayed as nginx's own.
error_log logs/error.log error;
error_log syslog:server=127.0.0.1:5140,tag=mgm_n,nohostname notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # nginx defaults proxy_read_timeout to 60s, which is the gap between two
    # reads from the upstream -- not the total request. That is far too short
    # for anything that thinks before answering: MegooPM's own AI page
    # generation was being cut off mid-flight and surfacing in the browser as
    # an opaque "Failed to fetch", because a 504 from here carries none of the
    # proxied app's CORS headers.
    #
    # These are deliberately LONGER than any timeout the backend applies to
    # itself, so the innermost one always fires first and the operator gets a
    # real message instead of a severed connection. A host that wants something
    # tighter can override both in its own advanced config.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # proxy_connect_timeout is deliberately left at its default: a connection
    # that takes a minute to establish is a dead upstream, and waiting longer
    # only delays finding out.

    # No cap on request bodies. nginx defaults to 1m, which rejects ordinary
    # uploads through a managed host with a 413 that the proxied app never sees
    # and cannot explain.
    #
    # The trade is real: nginx buffers a request body to disk before forwarding
    # it, so one client can fill the data volume with a single upload and
    # nothing here will stop them. A host that wants a bound sets its own
    # client_max_body_size in its advanced config, which overrides this.
    client_max_body_size 0;

    # Access/error log targets and trusted-proxy real-IP settings, rendered by
    # docker-entrypoint.sh from CROWDSEC_SYSLOG_ADDR / NGINX_REAL_IP_*.
    include /etc/nginx/logging.conf;

    # Live logs: one JSON object per request, sent to the loopback relay
    # (stream{} below) and stored nowhere. Every value is a string, so an empty
    # one ($upstream_status on a `return`) is still JSON.
    #
    # One access log, here, serves every server block: each syslog target is a
    # socket per worker, so a target per block would cost one per host. The
    # line names its host itself, first, in "k" ($mgm_key); the relay reads it
    # there, not from the shared tag. Each server block sets
    #     set $mgm_key <host key>;
    #     set $mgm_cs "";
    #     include /etc/nginx/logging-error-targets.conf;
    #     error_log syslog:server=127.0.0.1:5140,tag=mgm_<host key>,nohostname info;
    # An error line has no variables, so the error log stays per block, tagged
    # with the key; the include restates the error targets the block stops
    # inheriting once it declares its own error_log.
    log_format megoopm_live escape=json
        '{"k":"$mgm_key","ts":"$msec","st":"$status","m":"$request_method","u":"$request_uri",'
        '"pr":"$server_protocol","ip":"$remote_addr","ua":"$http_user_agent",'
        '"in":"$request_length","out":"$bytes_sent","rt":"$request_time",'
        '"up":"$upstream_addr","ust":"$upstream_status","urt":"$upstream_response_time",'
        '"h":"$host","loc":"$sent_http_location","cs":"$mgm_cs"}';
    # Declares $mgm_key with a value for a request no `set` reached: one nginx
    # refused before the server-rewrite phase (a malformed request line is a
    # 400 there), which no host claims. A `set` stores over it; without the map,
    # each of those requests would log an "uninitialized variable" warning.
    map $server_port $mgm_key {
        default u;
    }
    access_log syslog:server=127.0.0.1:5140,tag=mgm_x,nohostname megoopm_live;

    # DNS resolver for runtime name lookups (MEG-22 / defect 5c770e72 D1).
    # The CrowdSec bouncer reaches LAPI (crowdsec:8080) and AppSec
    # (crowdsec:7422) by *hostname* at request time, so nginx needs a resolver
    # or OpenResty logs `no resolver defined to resolve "crowdsec"` and never
    # talks to CrowdSec. 127.0.0.11 is Docker's embedded DNS; ipv6=off avoids a
    # spurious AAAA lookup for the compose-network A-only names.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # --- CrowdSec bouncer (MEG-22) ---
    # The bouncer + inline AppSec run as Lua in nginx's access phase (OpenResty;
    # see infra/nginx/Dockerfile). Enforcement is attached PER HOST by the
    # backend-generated vhosts (access_by_lua_file), not globally — a host with
    # the CrowdSec toggle off is never bounced. These directives only load and
    # initialise the module once so the per-host handler is cheap.
    #
    # `lua_shared_dict crowdsec_cache` is the decision cache the stock bouncer
    # module expects by name. If the module is absent (e.g. running the plain
    # nginx image without the bouncer) these are the only CrowdSec lines and the
    # managed vhosts simply won't reference the handler.
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict crowdsec_cache 50m;
    # Visitor counters. The log phase can only touch shared memory --
    # cosockets are unavailable there -- so counts accumulate here and a
    # timer pushes them to Redis. 10m holds ~100k distinct visitor keys.
    lua_shared_dict megoopm_visits 10m;
    init_by_lua_file /etc/nginx/lua/megoopm_crowdsec_init.lua;

    # Start the bouncer's stream-pull timer (MEG-22 / defect 5c770e72 D2).
    # crowdsec-bouncer.conf runs MODE=stream: decisions are pulled from LAPI on
    # an interval by a per-worker timer that `SetupStream()` arms. That timer
    # can only be created in the init_worker phase — init_by_lua alone leaves
    # the decision cache empty, so banned IPs are never blocked (`cscli bouncers
    # list` shows an empty "Last API pull"). _G.megoopm_crowdsec is set by
    # init_by_lua_file above and inherited by each forked worker.
    init_worker_by_lua_block {
        if _G.megoopm_crowdsec and _G.megoopm_crowdsec.SetupStream then
            _G.megoopm_crowdsec.SetupStream()
        end
        -- Drains the visitor counters into Redis. Must live here: timers can
        -- only be created from init_worker, and the log phase they serve
        -- cannot open a socket itself.
        local ok, analytics = pcall(require, "megoopm_analytics")
        if ok then
            pcall(analytics.start)
        end
    }

    # Visitor analytics. Wrapped in pcall so a fault here can never fail a
    # request that has already been served -- the module itself also times out
    # every Redis call, because pcall catches errors but not a hang.
    log_by_lua_block {
        local ok, mod = pcall(require, "megoopm_analytics")
        if ok then
            pcall(mod.log)
        end
        -- Live logs: tell the request line whether CrowdSec denied it.
        -- $mgm_cs is read by access_log, which runs after this.
        pcall(function() ngx.var.mgm_cs = ngx.ctx.mgm_cs or "" end)
    }

    # Websocket upgrade helper. Managed proxy-host blocks reference
    # $connection_upgrade when "allow_websocket_upgrade" is enabled; the map
    # must be defined exactly once in the http{} context, so it lives here in
    # the base config rather than in the per-host files the backend generates.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default server: answers the container healthcheck and swallows requests
    # for hosts MegooPM has not (yet) configured a vhost for.
    server {
        listen      80 default_server;
        server_name _;

        # Without this, a request matching no location falls through to
        # OpenResty's compiled-in root and is served its welcome page -- a
        # regression on the `return 404` this block used to hardcode, and a
        # needless disclosure of what is running. Pointing root at a path that
        # does not exist makes the fall-through a plain 404. The managed
        # location below sets its own root when it serves a document.
        root /var/empty/megoopm;

        # Live logs for requests no host claims: the "unclaimed" pseudo-host,
        # key `u`. This block is also what declares $mgm_cs on an install with
        # no hosts yet -- without one declaration megoopm_live fails `nginx -t`.
        set $mgm_key u;
        set $mgm_cs "";
        # The bouncer below runs in the same phase as `set` and before it, so
        # a denied request is logged with $mgm_cs never assigned. Empty is the
        # right value then; the warning nginx would log for every denied
        # scanner (and send to the relay) is not. ($mgm_key is `u` there too,
        # from the map above.)
        uninitialized_variable_warn off;
        include /etc/nginx/logging-error-targets.conf;
        error_log syslog:server=127.0.0.1:5140,tag=mgm_u,nohostname info;

        # CrowdSec bouncer for requests no host claims — almost all scanners.
        # Server-rewrite phase: the default site answers with `return`, which
        # runs before the access phase. /healthz is exempt: AppSec fails closed,
        # and a CrowdSec outage must not get nginx marked unhealthy and restarted.
        server_rewrite_by_lua_block {
            if ngx.var.uri ~= "/healthz" then
                require("megoopm_crowdsec_check").check()
            end
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The default site, chosen under Settings in the app and written here by
        # the backend. There is deliberately no `location /` fallback: nginx
        # answers 404 when no location matches, which is exactly what this block
        # used to hardcode -- so an absent file degrades to the old behaviour
        # rather than to something unintended. A second `location /` alongside
        # this include would be a duplicate-location error.
        include /data/nginx/default/*.conf;
    }

    # Connection counters for the dashboard, scraped by this node's worker.
    #
    # Deliberately NOT bound to 127.0.0.1: the scraper runs in a different
    # container and reaches this as `nginx:8081`. It is private by having no
    # `ports:` mapping, the same posture the reload agent on :9099 has.
    #
    # Only /stub_status answers; everything else 404s, so anything that reaches
    # the compose network learns connection counts and nothing more.
    server {
        listen 8081;
        server_name _;
        root /var/empty/megoopm;
        # Not a host: its lines carry no key, and the relay drops them.
        set $mgm_key "";

        location = /stub_status {
            stub_status;
            access_log off;
        }
    }

    # Managed virtual hosts written by the backend onto the shared volume.
    # Empty until the backend creates its first proxy host. The glob is
    # non-recursive, so the stream/ subdirectory (TCP/UDP forwards, below) is
    # never pulled into the http{} context.
    include /data/nginx/conf.d/*.conf;
}

# --- Raw TCP/UDP forwarding (MEG-24) ---
# Streams are a top-level context, a sibling of http{}. The backend writes one
# managed *.conf per stream into conf.d/stream/ on the same shared volume; this
# block includes them. Empty (and inert) until the first stream is created.
stream {
    # Stream Lua is a separate VM from http's: it needs its own path, its own
    # shared dict and its own resolver (Redis is reached by name).
    lua_package_path "/etc/nginx/lua/?.lua;;";
    # The relay's cache of "is anyone watching this host" (PUBSUB NUMSUB).
    lua_shared_dict megoopm_live 1m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Live logs for stream hosts: one line per connection, written when it
    # closes. Same conventions as megoopm_live in http{}: one access log for
    # every stream server, the key in "k" (each sets `set $mgm_key s<id>;`),
    # and an error log per server, tagged with the key.
    log_format megoopm_stream escape=json
        '{"k":"$mgm_key","ts":"$msec","ip":"$remote_addr","pr":"$protocol","st":"$status",'
        '"in":"$bytes_received","out":"$bytes_sent","dur":"$session_time",'
        '"up":"$upstream_addr","uin":"$upstream_bytes_received",'
        '"uout":"$upstream_bytes_sent"}';
    access_log syslog:server=127.0.0.1:5140,tag=mgm_x,nohostname megoopm_stream;

    # The live log relay (docs/live-logs.md). nginx on this node sends every
    # live line here; the Lua handler publishes the watched ones to Redis
    # pub/sub and drops the rest. Loopback and an IP literal, so it is always
    # there for `nginx -t` and reloads, whatever else is down.
    #
    # It logs only to stderr: a relay that logged to itself would feed its own
    # errors back in. Socket errors are off because an unreachable Redis is a
    # dropped line, not something to report once per datagram.
    server {
        listen 127.0.0.1:5140 udp;
        access_log off;
        # Declares $mgm_key for megoopm_stream on an install with no stream
        # hosts yet; this server logs nothing.
        set $mgm_key "";
        error_log stderr warn;
        lua_socket_log_errors off;
        content_by_lua_block {
            local ok, relay = pcall(require, "megoopm_live_relay")
            if ok then
                relay.handle()
            end
        }
    }

    include /data/nginx/conf.d/stream/*.conf;
}
