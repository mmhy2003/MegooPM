# Base config for the managed nginx proxy MegooPM controls.
#
# This file is the stable entrypoint mounted read-only. The MegooPM backend
# generates one *.conf per managed host into /etc/nginx/conf.d (a shared named
# volume), and this config `include`s them. TLS certs land on a second shared
# volume at /etc/nginx/certs. Reload managed vhosts with `nginx -s reload`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Websocket upgrade helper. Managed proxy-host blocks reference
    # $connection_upgrade when "allow_websocket_upgrade" is enabled; the map
    # must be defined exactly once in the http{} context, so it lives here in
    # the base config rather than in the per-host files the backend generates.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default server: answers the container healthcheck and swallows requests
    # for hosts MegooPM has not (yet) configured a vhost for.
    server {
        listen      80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # Managed virtual hosts written by the backend onto the shared volume.
    # Empty until the backend creates its first proxy host.
    include /etc/nginx/conf.d/*.conf;
}
