# MegooPM — PRODUCTION, multi-node: run this file ON EVERY NODE.
#
#   cp .env.ha.example .env      # per node: NODE_ID, SHARED_DATA_PATH, secrets, URLs
#   docker compose -f docker-compose.ha.yml up -d --build      # or: make ha-up
#
# Every node runs the stateless app tier (API, Celery worker, managed nginx,
# web UI) against ONE shared data root mounted from the host at
# SHARED_DATA_PATH (NFS or another shared filesystem — docs/ha.md §2/§6) and
# shared Postgres/Redis/CrowdSec. Per-node profiles, chosen with
# COMPOSE_PROFILES in that node's .env:
#
#   control-plane   also run Postgres, Redis and CrowdSec LAPI here and publish
#                   them on the host (small clusters; otherwise use managed /
#                   external services and point the *_URL variables at them).
#
# Beat is NOT a profile: every node runs one. Each node's beat reconciles that
# node against the shared config version, which is what bounds how long any node
# can serve stale config; cluster-wide sweeps stay singletons via a leader lock.
#
# Migrations: set RUN_MIGRATIONS=1 on the node you upgrade first, 0 elsewhere.
# No load balancer inside: put yours in front of :80/:443 (and :3000/:8000 if
# the admin surface should be balanced too) — infra/ha/haproxy.cfg is an example.

name: megoopm-ha

x-app-env: &app-env
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required and must be IDENTICAL on every node}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (shared Postgres)}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required (shared Redis)}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # --- HA (docs/ha.md) ---
  HA_ENABLED: "true"
  NODE_ID: ${NODE_ID:?NODE_ID is required and must be unique per node}
  SHARED_DATA_DIR: /data
  # Node-local (NOT on the shared mount): run dir + reload marker.
  HA_LOCK_DIR: /var/run/megoopm
  NGINX_RELOAD_MARKER_PATH: /var/run/megoopm/nginx-config.version
  HA_RECONCILE_INTERVAL_SECONDS: ${HA_RECONCILE_INTERVAL_SECONDS:-15}
  # Worker -> LOCAL nginx via the in-container reload agent.
  NGINX_TEST_COMMAND: "python -m scripts.nginx_remote test"
  NGINX_RELOAD_COMMAND: "python -m scripts.nginx_remote reload"
  NGINX_AGENT_ADDR: nginx:9099
  NGINX_RELOAD_TOKEN: ${NGINX_RELOAD_TOKEN:?NGINX_RELOAD_TOKEN is required}
  ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
  ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-}
  ACME_DNS_PROPAGATION_TIMEOUT_SECONDS: ${ACME_DNS_PROPAGATION_TIMEOUT_SECONDS:-120}
  ACME_DNS_PROPAGATION_INTERVAL_SECONDS: ${ACME_DNS_PROPAGATION_INTERVAL_SECONDS:-5}
  ACME_DNS_PROPAGATION_SETTLE_SECONDS: ${ACME_DNS_PROPAGATION_SETTLE_SECONDS:-10}
  CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL:?CROWDSEC_LAPI_URL is required (shared LAPI)}
  CROWDSEC_LAPI_KEY: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is required}
  # Matches the shared LAPI's auto_registration token: the cluster's one
  # machine (credentials live in the shared DB) is validated automatically.
  CROWDSEC_REGISTRATION_TOKEN: ${CROWDSEC_REGISTRATION_TOKEN:?CROWDSEC_REGISTRATION_TOKEN is required and IDENTICAL on every node}
  # Whitelist reloads: names the node whose worker holds the docker socket
  # and runs the CrowdSec container. Blank disables reloads — whitelists
  # then save but are reported as not applied. See docs/crowdsec.md.
  CROWDSEC_CONTROL_NODE_ID: ${CROWDSEC_CONTROL_NODE_ID:-}
  CROWDSEC_CONTAINER_NAME: ${CROWDSEC_CONTAINER_NAME:-megoopm-crowdsec-1}
  CROWDSEC_RELOAD_HEALTH_TIMEOUT_SECONDS: ${CROWDSEC_RELOAD_HEALTH_TIMEOUT_SECONDS:-60}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}

services:
  # One-shot: lay out the shared root and hand it to uid 1000. Fails fast when
  # the mount is not writable by root/uid 1000 (e.g. NFS root_squash without a
  # matching anonuid) instead of letting the backend hit PermissionError later.
  data-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - "mkdir -p /data/nginx/conf.d/stream /data/certs/_acme-challenge /data/crowdsec/whitelists && { [ -f /data/crowdsec/whitelists/megoopm.yaml ] || echo '# Managed by MegooPM - no whitelists defined.' > /data/crowdsec/whitelists/megoopm.yaml; } && chown -R 1000:1000 /data || { echo 'data-init: cannot prepare /data (SHARED_DATA_PATH) for uid 1000' >&2; exit 1; }"
    volumes:
      - ${SHARED_DATA_PATH:?SHARED_DATA_PATH is required (host path of the shared mount)}:/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${SHARED_DATA_PATH:?}:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ${SHARED_DATA_PATH:?}:/data
      # Reload path: the worker restarts the CrowdSec container so it
      # re-reads the whitelist parser file. Mounted here and deliberately NOT
      # on `backend` — the socket is root-equivalent on the host and backend is
      # the process taking internet traffic.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app.celery_app", "inspect", "ping"]
      interval: 20s
      timeout: 10s
      start_period: 25s
      retries: 5

  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    environment:
      CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL:?}
      CROWDSEC_APPSEC_URL: ${CROWDSEC_APPSEC_URL:?CROWDSEC_APPSEC_URL is required (shared AppSec)}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?}
      NGINX_RELOAD_TOKEN: ${NGINX_RELOAD_TOKEN:?}
      # This node's nginx ships its logs to the shared CrowdSec agent's
      # syslog port (control-plane host:514/udp). Real-IP for CDN/LB setups.
      CROWDSEC_SYSLOG_ADDR: ${CROWDSEC_SYSLOG_ADDR:?CROWDSEC_SYSLOG_ADDR is required (shared CrowdSec host:514)}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-}
      NGINX_REAL_IP_FROM: ${NGINX_REAL_IP_FROM:-}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SHARED_DATA_PATH:?}:/data
    depends_on:
      data-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-true}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # Runs on EVERY node, not one. Its reconcile tick is routed to this node's own
  # queue (megoopm.node.$NODE_ID), so beat is what guarantees THIS node converges
  # within HA_RECONCILE_INTERVAL_SECONDS even if the applying node's push never
  # arrived — the node was down, partitioned, or newly added. Cluster-wide sweeps
  # (cert renewal) stay singletons via the Postgres leader lock, which is what
  # makes running N beats safe.
  beat:
    build: ./backend
    restart: unless-stopped
    # The schedule file must stay node-local and off the shared mount.
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true

  # ---------------- profile: control-plane (one node, small clusters) ----
  db:
    profiles: ["control-plane"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megoopm}
      # Empty makes the postgres image refuse to initialise — set it on the
      # control-plane node's .env (and use the same value in DATABASE_URL).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-megoopm}
    ports:
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megoopm} -d ${POSTGRES_DB:-megoopm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["control-plane"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  crowdsec:
    profiles: ["control-plane"]
    depends_on:
      # The whitelist mount below is a bind mount of a FILE. Docker creates a
      # DIRECTORY at the source when it does not exist, and CrowdSec then
      # refuses to start — so this must not come up before data-init has
      # seeded the file.
      data-init:
        condition: service_completed_successfully
    image: crowdsecurity/crowdsec:v1.6.4
    restart: unless-stopped
    environment:
      DISABLE_ONLINE_API: "true"
      BOUNCER_KEY_megoopm: ${CROWDSEC_BOUNCER_KEY:?}
      CROWDSEC_REGISTRATION_TOKEN: ${CROWDSEC_REGISTRATION_TOKEN:?}
      COLLECTIONS: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/nginx"
    ports:
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:${CROWDSEC_LAPI_PORT:-8080}:8080"
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:${CROWDSEC_APPSEC_PORT:-7422}:7422"
      # Syslog acquisition: every node's nginx ships its logs here.
      - "${CONTROL_PLANE_BIND:-0.0.0.0}:${CROWDSEC_SYSLOG_PORT:-514}:514/udp"
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./infra/crowdsec/acquis/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - ./infra/crowdsec/acquis/nginx-syslog.yaml:/etc/crowdsec/acquis.d/nginx-syslog.yaml:ro
      # LAPI machine auto-registration (token from the env above).
      - ./infra/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      # Whitelists authored in the UI. A single-FILE mount: s02-enrich also
      # holds hub-installed parsers (geoip enrichment among them), and
      # mounting a directory over it would mask them. data-init seeds the
      # file, because Docker creates a DIRECTORY when a bind-mount source is
      # missing and CrowdSec then refuses to start.
      - ${SHARED_DATA_PATH:?}/crowdsec/whitelists/megoopm.yaml:/etc/crowdsec/parsers/s02-enrich/99-megoopm-whitelist.yaml:ro

volumes:
  # Control-plane node only (local state of the shared services).
  pgdata:
  crowdsec_config:
  crowdsec_data:
