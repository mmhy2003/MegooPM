# Local development stack: Postgres + Redis + backend API + Celery worker/beat.
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: megoopm
      POSTGRES_PASSWORD: megoopm
      POSTGRES_DB: megoopm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megoopm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://megoopm:megoopm@db:5432/megoopm
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Managed nginx: serves proxied traffic. Its base config `include`s the
  # per-host *.conf files the backend writes onto the shared nginx_confd volume
  # (see infra/nginx/nginx.conf and app/services/nginx). TLS material lands on
  # the shared nginx_certs volume.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_confd:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery worker: consumes the queue and runs tasks, including the nginx
  # regenerate-and-reload task. It writes generated *.conf onto the shared
  # nginx_confd volume (the config-generation path is fully wired here).
  #
  # RELOAD TRANSPORT (deployment decision): validating and signalling nginx from
  # a separate worker container is topology-specific. The engine shells out to
  # NGINX_TEST_COMMAND / NGINX_RELOAD_COMMAND (default `nginx -t` / `nginx -s
  # reload`), so the recommended production topology co-locates the worker with
  # an nginx binary + shared pid (or a sidecar-exec/SSH shim). This base image
  # ships no nginx client, so the default commands are a placeholder here — see
  # docs/nginx-engine.md. No migrations (see worker-entrypoint.sh).
  worker:
    build: .
    entrypoint: ["./worker-entrypoint.sh"]
    command:
      ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://megoopm:megoopm@db:5432/megoopm
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      NGINX_CONFD_DIR: /etc/nginx/conf.d
      NGINX_CERTS_DIR: /etc/nginx/certs
    volumes:
      - nginx_confd:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_started

  # Celery beat: schedules periodic jobs onto the queue.
  beat:
    build: .
    entrypoint: ["./worker-entrypoint.sh"]
    command:
      ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  # Shared with the nginx container: the backend writes managed vhost configs
  # here and nginx `include`s them.
  nginx_confd:
  # Shared with the nginx container: TLS certificate material.
  nginx_certs:
