# Local development stack: Postgres + Redis + backend API + Celery worker/beat.
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: megoopm
      POSTGRES_PASSWORD: megoopm
      POSTGRES_DB: megoopm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megoopm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://megoopm:megoopm@db:5432/megoopm
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker: consumes the queue and runs tasks. No migrations (see
  # worker-entrypoint.sh); the api service owns schema management.
  worker:
    build: .
    entrypoint: ["./worker-entrypoint.sh"]
    command:
      ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://megoopm:megoopm@db:5432/megoopm
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat: schedules periodic jobs onto the queue.
  beat:
    build: .
    entrypoint: ["./worker-entrypoint.sh"]
    command:
      ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
