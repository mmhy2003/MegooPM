[project]
name = "megoopm-backend"
version = "0.1.0"
description = "MegooPM backend — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Synchronous Postgres driver for the `sync_database_url` path: Celery
    # coordination tasks (HA advisory locks / config-version bumps, MEG-35) run
    # outside the event loop and use a sync engine.
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # LAPI client for the CrowdSec integration (MEG-22) and the async HTTP
    # stack the ASGI test client also builds on.
    "httpx>=0.27",
    # MMDB reader for the bundled country database (visitor analytics).
    # Pure Python: no C extension to build, no network at runtime.
    "maxminddb>=2.6",
    # TLS certificate management (MEG-19): PEM parsing/validation + self-signed
    # issuance (cryptography) and ACME/Let's Encrypt issuance (acme).
    "cryptography>=42",
    "acme>=2.9",
    # DNS-01 challenge providers: dns-lexicon drives ~86 DNS provider APIs behind
    # one interface (route53 extra pulls boto3); dnspython verifies propagation
    # on the zone's authoritative nameservers before the challenge is answered.
    "dns-lexicon[route53]>=3.25",
    "dnspython>=2.6",
    # LLM integration: one model string names any of ~100 providers. Heavy —
    # ~190 MB with openai/tokenizers/huggingface-hub — and 3.49s to import,
    # which is why app/services/llm.py imports it lazily.
    "litellm>=1.99",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Enable pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP),
# flake8-bugbear (B), and comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated; relax import-order and line-length noise.
"alembic/**" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
